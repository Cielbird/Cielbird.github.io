<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geþeode Apply Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #23292e;
      font-family: monospace;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .demo {
      width: 100%;
      max-width: 860px;
    }
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    h2 {
      margin: 0 0 1.2rem;
      font-size: 0.85rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .section {
      background: #f6f6f6;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    label {
      color: #5a6270;
      font-size: 0.78rem;
      display: block;
      margin-bottom: 0.35rem;
    }
    input[type=text] {
      background: #fff;
      border: 1px solid #c0c0c0;
      color: #23292e;
      padding: 7px 10px;
      font-family: monospace;
      font-size: 1rem;
      width: 100%;
      border-radius: 4px;
      outline: none;
    }
    input[type=text]:focus { border-color: #4a90d9; }

    /* arrow + output */
    .arrow {
      text-align: center;
      color: #8b949e;
      font-size: 2rem;
      margin: 0.5rem 0;
    }
    .output {
      font-size: 1.5rem;
      color: #46472c;
      min-height: 1.1rem;
      padding: 4px 0;
    }
    .error { color: #c0392b; font-size: 0.85rem; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="demo">

    <div class="section">
      <label>Rule</label>
      <input id="rule" type="text" value="t -> d / V_V" spellcheck="false">
    </div>

    <div class="section">
      <label>Input (IPA)</label>
      <input id="input" type="text" value="ata" spellcheck="false">
    </div>

    <div class="arrow">↓</div>

    <div class="section">
      <label>Output</label>
      <div class="output" id="output">…</div>
      <div class="error" id="error"></div>
    </div>
  </div>

  <script type="module">
    import init, { apply_rule } from "./pkg/hello_wasm.js";

    await init();

    const ruleInput = document.getElementById("rule");
    const textInput = document.getElementById("input");
    const outputEl  = document.getElementById("output");
    const errorEl   = document.getElementById("error");

    let activeBtn = null;

    const update = () => {
      try {
        outputEl.textContent = apply_rule(ruleInput.value, textInput.value);
        errorEl.textContent = "";
      } catch (e) {
        outputEl.textContent = "";
        errorEl.textContent = e;
      }
    };

    ruleInput.addEventListener("input", () => { activeBtn?.classList.remove("active"); activeBtn = null; update(); });
    textInput.addEventListener("input", () => { activeBtn?.classList.remove("active"); activeBtn = null; update(); });

    update();
  </script>
</body>
</html>
