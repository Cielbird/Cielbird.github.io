<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello WASM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #e6edf3;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .demo {
      width: 100%;
      max-width: 520px;
    }
    h2 {
      margin: 0 0 1.2rem;
      font-size: 1rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .section {
      background: #f6f6f6;
      border: 1px solid #989898;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    label { color: #393d41; font-size: 0.85rem; display: block; margin-bottom: 0.4rem; }
    .row { display: flex; align-items: center; gap: 0.6rem; }
    input[type=number] {
      background: #e7e7e7;
      border: 1px solid #30363d;
      color: #23292e;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 1rem;
      width: 80px;
      border-radius: 4px;
    }
    input[type=range] { flex: 1; accent-color: #58a6ff; }
    .result {
      font-size: 1.6rem;
      color: #58a6ff;
      min-width: 3rem;
      text-align: right;
    }
    .primes {
      font-size: 0.8rem;
      color: #3fb950;
      line-height: 1.6;
      word-break: break-all;
      max-height: 5rem;
      overflow-y: auto;
    }
    .op { color: #8b949e; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Rust + WebAssembly</h2>

    <div class="section">
      <label>add(a, b)</label>
      <div class="row">
        <input id="a" type="number" value="3">
        <span class="op">+</span>
        <input id="b" type="number" value="4">
        <span class="op">=</span>
        <div class="result" id="sum">?</div>
      </div>
    </div>

    <div class="section">
      <label>primes up to <span id="limit-label">50</span></label>
      <div class="row">
        <input id="limit" type="range" min="2" max="200" value="50">
      </div>
      <div class="primes" id="primes">...</div>
    </div>
  </div>

  <script type="module">
    import init, { add, primes_up_to } from "./pkg/hello_wasm.js";

    await init();

    const sumOut = document.getElementById("sum");
    const primesOut = document.getElementById("primes");
    const limitLabel = document.getElementById("limit-label");

    const updateAdd = () => {
      const a = parseInt(document.getElementById("a").value) || 0;
      const b = parseInt(document.getElementById("b").value) || 0;
      sumOut.textContent = add(a, b);
    };

    const updatePrimes = () => {
      const limit = parseInt(document.getElementById("limit").value);
      limitLabel.textContent = limit;
      const result = primes_up_to(limit);
      primesOut.textContent = Array.from(result).join(", ");
    };

    document.getElementById("a").addEventListener("input", updateAdd);
    document.getElementById("b").addEventListener("input", updateAdd);
    document.getElementById("limit").addEventListener("input", updatePrimes);

    updateAdd();
    updatePrimes();
  </script>
</body>
</html>
