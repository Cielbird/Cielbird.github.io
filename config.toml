base_url = "https://cielbird.github.io"
title = "cielbird"
description = "blog & portfolio"
default_language = "en"
theme = "folio"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
highlight_code = true
highlight_theme = "gruvbox-dark"
external_links_target_blank = true
smart_punctuation = false

[[taxonomies]]
name = "tags"
feed = true
paginate_by = 10

